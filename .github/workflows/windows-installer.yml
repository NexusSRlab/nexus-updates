# Compila el instalador de Windows (.exe) y lo adjunta a la release.
#
# POR QUÉ VIVE AQUÍ: el compilador de Inno Setup solo corre en Windows, e Iker
# desarrolla en un Mac. Esta máquina de GitHub es un Windows de verdad, así que
# además de compilar puede INSTALARLO y comprobar que queda bien: es la única
# verificación del camino que recorre un alumno de Windows.
#
# La fuente de verdad de este fichero está en el repositorio de la app, en
# build_assets/windows-installer.yml. Si lo editas aquí, cópialo allí.
#
# El guion nexus_setup.iss lo genera build_release.sh y lo sube
# publish_release.sh como fichero de la release.

name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (ej. v1.1.2). Vacío = la última."
        required: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Averiguar la release
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.event.release.tag_name }}" }
          if (-not $tag) {
            $tag = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName)
          }
          if (-not $tag) { throw "No se ha podido determinar la release." }
          Write-Host "Release: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Descargar el paquete y el guion de Inno Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path work | Out-Null
          gh release download ${{ steps.rel.outputs.tag }} --repo $env:GITHUB_REPOSITORY `
             --pattern "NexusSR-v*-win.zip" --dir work
          gh release download ${{ steps.rel.outputs.tag }} --repo $env:GITHUB_REPOSITORY `
             --pattern "nexus_setup.iss" --dir work
          $zip = (Get-ChildItem work\NexusSR-v*-win.zip)[0].FullName
          # El .iss referencia la carpeta por su nombre (NexusSR-vX.Y.Z\*), así
          # que se extrae AL LADO del guion y no dentro de otra carpeta.
          Expand-Archive -Path $zip -DestinationPath work -Force
          Get-ChildItem work | Select-Object Name

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup ya viene en la imagen."
          } else {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "No se encuentra ISCC.exe tras instalar." }

      - name: Compilar el instalador
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "work\nexus_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "La compilacion fallo (exit $LASTEXITCODE)" }
          $exe = (Get-ChildItem work\NexusSR-Setup-v*.exe)[0]
          Write-Host ("Instalador: {0} ({1:N1} MB)" -f $exe.Name, ($exe.Length / 1MB))
          "EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Esto es lo que ninguna otra comprobacion hace: recorrer la instalacion
      # como un alumno. En silencio, porque aqui no hay nadie para pulsar botones.
      - name: Instalarlo y comprobar que queda bien
        shell: pwsh
        run: |
          $p = Start-Process -FilePath $env:EXE `
                 -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador devolvio $($p.ExitCode)" }

          $dir = Join-Path $env:LOCALAPPDATA "Programs\Nexus SR"
          $faltan = @()
          foreach ($f in @("Nexus SR.vbs","Start_NexusSR.bat","app.R","run_app.R","VERSION","nexus.ico","R","www")) {
            if (-not (Test-Path (Join-Path $dir $f))) { $faltan += $f }
          }
          if ($faltan.Count -gt 0) { throw "Faltan tras instalar: $($faltan -join ', ')" }

          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Nexus SR\Nexus SR.lnk"
          if (-not (Test-Path $menu)) { throw "No se ha creado el acceso directo del menu Inicio." }

          $ver = (Get-Content (Join-Path $dir "VERSION")).Trim()
          Write-Host "Instalado correctamente: Nexus SR $ver en $dir"
          Write-Host "Acceso directo del menu Inicio: OK"

      # El alumno NO tiene pwsh: tiene Windows PowerShell 5.1, que lee un .ps1
      # sin BOM como ANSI (Windows-1252). La 1.1.3 llevaba un guion largo en una
      # cadena que ahi se convierte en comilla tipografica: el lanzador no
      # llegaba ni a parsear, y el acceso directo "no hacia nada". pwsh lee
      # UTF-8 y no lo ve. Por eso este paso usa shell: powershell (5.1) y lee el
      # fichero con la codificacion ANSI, como lo lee el motor.
      - name: El lanzador parsea en Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Nexus SR"
          $ps1 = Join-Path $dir "Start_NexusSR_win.ps1"
          if (-not (Test-Path $ps1)) { throw "Falta Start_NexusSR_win.ps1 tras instalar." }
          $text = [System.IO.File]::ReadAllText($ps1, [System.Text.Encoding]::Default)
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "Linea $($_.Extent.StartLineNumber): $($_.Message)" }
            throw "El lanzador no parsea en Windows PowerShell 5.1."
          }
          # Aunque hoy parsee, un byte no ASCII es una bomba de relojeria.
          $bytes = [System.IO.File]::ReadAllBytes($ps1)
          $noAscii = @($bytes | Where-Object { $_ -gt 127 }).Count
          if ($noAscii -gt 0) { throw "Start_NexusSR_win.ps1 tiene $noAscii bytes no ASCII." }
          Write-Host "Lanzador OK en Windows PowerShell 5.1"

      # 1.1.4: un alumno con R instalado recibia "Rscript not found". Aqui se
      # ejecutan las funciones de busqueda del lanzador de verdad (sacadas del
      # propio .ps1 instalado, sin arrancar la app) en Windows PowerShell 5.1.
      - name: El lanzador encuentra R
        shell: powershell
        run: |
          $ps1 = Join-Path $env:LOCALAPPDATA "Programs\Nexus SR\Start_NexusSR_win.ps1"
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($ps1, [ref]$null, [ref]$null)
          $funcs = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)
          foreach ($f in $funcs) { . ([scriptblock]::Create($f.Extent.Text)) }
          $RPATH_FILE = Join-Path $env:RUNNER_TEMP "rscript_path.txt"
          $script:R_SEARCHED = @()

          $found = Get-RscriptPath
          Write-Host "R del runner: $found"
          if (-not $found) { throw "No encuentra el R instalado. Buscado en: $($script:R_SEARCHED -join ' | ')" }

          # La ruta elegida a mano manda sobre todo lo demas.
          $fake = Join-Path $env:RUNNER_TEMP "R-hand\bin\Rscript.exe"
          New-Item -ItemType File -Force -Path $fake | Out-Null
          Set-Content -Path $RPATH_FILE -Value $fake
          $hand = Get-RscriptPath
          if ($hand -ne $fake) { throw "No respeta la ruta elegida a mano: $hand" }
          Write-Host "Ruta elegida a mano: OK"

      - name: Adjuntar el instalador a la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copia con nombre estable para que dl.nexussr.org/exe apunte siempre
          # a la ultima, igual que /mac y /win.
          Copy-Item $env:EXE "work\NexusSR-Setup.exe" -Force
          gh release upload ${{ steps.rel.outputs.tag }} --repo $env:GITHUB_REPOSITORY `
             "$env:EXE" "work\NexusSR-Setup.exe" --clobber
          Write-Host "Subido a la release ${{ steps.rel.outputs.tag }}"

      # El guion de Inno Setup solo sirve para compilar: en la lista de ficheros
      # de la release confundia al alumno. Se quita una vez compilado y subido el
      # .exe. Para recompilar a mano (workflow_dispatch) hay que volver a subirlo
      # desde _build/win/nexus_setup.iss de ese mismo build.
      - name: Quitar el guion de Inno Setup de la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset ${{ steps.rel.outputs.tag }} nexus_setup.iss --repo $env:GITHUB_REPOSITORY --yes
          Write-Host "nexus_setup.iss retirado de la release"
