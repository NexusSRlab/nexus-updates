# Windows smoke test para Nexus SR.
# Este fichero se DESPLIEGA en el repo NexusSRlab/nexus-updates, en la ruta
#   .github/workflows/windows-smoke.yml
# (este proyecto no tiene remoto, así que esta copia es solo la fuente de verdad
#  para editarlo; el que se ejecuta vive en nexus-updates).
#
# Qué hace: en una máquina Windows REAL de GitHub, descarga el último paquete
# -win.zip publicado, instala R, instala los paquetes como en el primer arranque
# de un alumno, levanta la app y comprueba que sirve HTTP 200. Es la verificación
# de Windows que no se puede hacer en un Mac.
#
# Cómo lanzarlo: en github.com/NexusSRlab/nexus-updates > pestaña Actions >
# "Windows smoke test" > Run workflow. También se ejecuta solo al publicar
# cada release.
name: Windows smoke test

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Download latest Windows bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          gh release download --repo ${{ github.repository }} --pattern "NexusSR-v*-win.zip" --dir bundle
          $zip = (Get-ChildItem bundle\NexusSR-v*-win.zip)[0].FullName
          Expand-Archive -Path $zip -DestinationPath app -Force
          $appDir = (Get-ChildItem app -Directory)[0].FullName
          "APP_DIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Bundle extraido en: $appDir"

      - name: Install app R packages (first-run path)
        shell: pwsh
        run: |
          Rscript --vanilla "$env:APP_DIR\install_core_packages.R"
          if ($LASTEXITCODE -ne 0) { throw "La instalacion de paquetes fallo (exit $LASTEXITCODE)" }

      - name: Load the whole app on Windows (deterministic build check)
        shell: pwsh
        run: |
          # We DON'T wait for runApp to serve: on this cold 2-core CI VM,
          # Windows Defender scanning every package DLL makes the first bind take
          # 10-26 minutes (highly variable), which is a runner artifact, not a
          # real student experience. (Full HTTP serving on Windows was verified
          # manually — "Listening on http://127.0.0.1:7878" appeared.)
          # Instead we source app.R end-to-end: this loads all ~40 packages,
          # sources all ~90 R files, and builds the ui/server objects, failing
          # deterministically on any Windows-specific code or dependency error.
          $rdir = $env:APP_DIR -replace '\\','/'
          $r = @"
          setwd('$rdir')
          source('app.R')
          if (!exists('ui') || !exists('server')) stop('ui/server not defined after sourcing app.R')
          cat('OK: app.R fully sourced; ui and server built on real Windows\n')
          "@
          $r | Out-File -Encoding ascii check.R
          Rscript --vanilla check.R
          if ($LASTEXITCODE -ne 0) { throw "La app no cargo en Windows (exit $LASTEXITCODE)" }
